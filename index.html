<!DOCTYPE html>
<html>
<head>
    <title>Obsidian OAuth Bridge</title>
</head>
<body>
    <h2 id="status">Completing authentication...</h2>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        
        if (code) {
            // Send auth code back into Obsidian protocol
            window.location.href = "obsidian://google-calendar-oauth?code=" + encodeURIComponent(code);
            document.getElementById("status").innerText = "Success! You can return to Obsidian now.";
        } else {
            document.getElementById("status").innerText = "Error: No authorization code found in URL.";
        }
    </script>
</body>
</html>
